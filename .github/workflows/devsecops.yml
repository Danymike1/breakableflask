
name: Automatisation des tests DevSecOps

on:
  push:

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Scanner requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: echo "Votre application est prete a etre deployee"
