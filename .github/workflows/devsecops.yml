
name: Automatisation des tests DevSecOps

on: [push, pull_request]

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Installer Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scanner les dependances
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Installer Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scanner le Dockerfile
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: echo "Les controles sont valides. Application prete au deploiement."
